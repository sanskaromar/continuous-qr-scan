<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>QR Text Receiver</title>

<style>
:root {
    --bg: #0b1020;
    --card: #151c2e;
    --card2: #1d263b;
    --border: #2d3a58;
    --text: #edf2ff;
    --muted: #a2aec4;
    --primary: #4f8cff;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --missing: #26324a;
}

@media (prefers-color-scheme: light) {
    :root {
        --bg: #eef2f7;
        --card: #ffffff;
        --card2: #f5f7fa;
        --border: #d7deea;
        --text: #182033;
        --muted: #64748b;
        --primary: #2563eb;
        --success: #16a34a;
        --danger: #dc2626;
        --warning: #d97706;
        --missing: #e5eaf1;
    }
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {
    width: min(100%, 960px);
    margin: auto;
    padding: 16px;
}

h1 {
    margin: 0 0 8px;
    font-size: 1.8rem;
}

.subtitle {
    color: var(--muted);
    line-height: 1.5;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin: 16px 0;
}

.label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
}

input,
textarea,
button {
    font: inherit;
}

input[type="number"],
textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
}

textarea {
    font-family: monospace;
    resize: vertical;
}

button {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.primary {
    background: var(--primary);
    color: white;
}

.success {
    background: var(--success);
    color: white;
}

.danger {
    background: var(--danger);
    color: white;
}

.setup-row,
.actions {
    display: flex;
    gap: 10px;
}

.setup-row input {
    flex: 1;
}

.camera-status {
    font-weight: 700;
    margin-bottom: 10px;
}

.dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--danger);
    margin-right: 6px;
}

.dot.active {
    background: var(--success);
}

#videoContainer {
    position: relative;
    width: 100%;
    background: black;
    border-radius: 12px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
    max-height: 70vh;
    object-fit: contain;
    background: black;
}

#scanOverlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
}

.scan-box {
    width: min(80vw, 500px);
    aspect-ratio: 1;
    border: 3px solid var(--primary);
    border-radius: 12px;
}

.scan-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.scan-actions button {
    width: 100%;
}

.message {
    margin-top: 10px;
    min-height: 24px;
    color: var(--muted);
}

.message.success {
    color: var(--success);
}

.message.error {
    color: var(--danger);
}

.message.warning {
    color: var(--warning);
}

#pendingData {
    min-height: 180px;
}

#assembledOutput {
    min-height: 350px;
}

#debugOutput {
    min-height: 160px;
}

.progress-track {
    height: 14px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--missing);
    margin: 10px 0;
}

#progressFill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.2s;
}

.chunk-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap: 6px;
    max-height: 250px;
    overflow: auto;
}

.chunk {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    background: var(--missing);
    border-radius: 6px;
    font-size: 0.75rem;
}

.chunk.captured {
    background: var(--success);
    color: white;
}

.range-row {
    display: none;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
}

.range-row input {
    flex: 1;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px;
    margin-top: 12px;
}

.info {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.85rem;
}

@media (max-width: 600px) {

    .setup-row,
    .actions {
        flex-direction: column;
    }

    video {
        min-height: 380px;
        max-height: 60vh;
    }

    .scan-actions {
        grid-template-columns: 1fr;
    }

}
</style>

</head>

<body>

<main class="app">

<h1>QR Text Receiver</h1>

<p class="subtitle">
Capture raw-text QR codes manually and concatenate them exactly in capture order.
</p>

<section class="card">

<label class="label">
Expected Number of QR Codes
</label>

<div class="setup-row">

<input
id="expectedCount"
type="number"
min="1"
placeholder="Example: 50"

>

<button
id="startTransferBtn"
class="primary"

>

Start Transfer </button>

</div>

</section>

<section class="card">

<div class="camera-status">
<span id="cameraDot" class="dot"></span>
<span id="cameraStatus">Camera: starting...</span>
</div>

<div id="videoContainer">

<video
id="video"
autoplay
playsinline
muted

> </video>

<div id="scanOverlay">
<div class="scan-box"></div>
</div>

</div>

<!-- ACTION BUTTONS DIRECTLY BELOW CAMERA -->

<div class="scan-actions">

<button
id="captureBtn"
class="success"
disabled

>

Capture This QR </button>

<button
id="scanNextBtn"
class="primary"
disabled

>

Scan Next QR </button>

</div>

<div id="message" class="message">
Initializing...
</div>

<div class="range-row" id="zoomRow">

<label for="zoomSlider">
Zoom
</label>

<input
id="zoomSlider"
type="range"
min="1"
max="1"
step="0.1"

>

<span id="zoomValue">1x</span>

</div>

<div class="info-grid">

<div class="info">
<strong>Camera resolution</strong><br>
<span id="resolutionInfo">Unknown</span>
</div>

<div class="info">
<strong>Decoder</strong><br>
<span id="decoderInfo">Checking...</span>
</div>

<div class="info">
<strong>Frames processed</strong><br>
<span id="frameInfo">0</span>
</div>

<div class="info">
<strong>Detection</strong><br>
<span id="detectionInfo">Waiting</span>
</div>

</div>

</section>

<section class="card">

<span class="label">
Current QR Detected
</span>

<div id="pendingInfo">
Waiting for QR...
</div>

<textarea
    id="pendingData"
    readonly
    placeholder="Decoded text appears here..."
></textarea>

</section>

<section class="card">

<div>
<strong id="progressText">
Captured: 0 / ?
</strong>
</div>

<div class="progress-track">
<div id="progressFill"></div>
</div>

<div
    id="chunkGrid"
    class="chunk-grid"
></div>

</section>

<section class="card">

<div class="actions">

<button
id="downloadBtn"
class="primary"
disabled

>

Download Assembled Text </button>

<button
id="resetBtn"
class="danger"

>

Clear / Reset </button>

</div>

</section>

<section class="card">

<span class="label">
Assembled Text
</span>

<textarea
    id="assembledOutput"
    readonly
></textarea>

</section>

<section class="card">

<span class="label">
Debug
</span>

<textarea
    id="debugOutput"
    readonly
></textarea>

</section>

</main>

<script>

/* =========================================================
   STATE
========================================================= */

let stream = null;
let videoTrack = null;
let detector = null;

let scanning = false;
let animationId = null;

let totalChunks = null;
let capturedCount = 0;

let pendingText = null;
let lockedText = null;

let qrDetected = false;

let framesProcessed = 0;
let lastScanTime = 0;

/*
 * Approximately 30 decode attempts per second.
 * The detector pauses immediately after successful detection.
 */
const SCAN_INTERVAL = 33;

const chunks = [];


/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById("video");

const cameraDot =
    document.getElementById("cameraDot");

const cameraStatus =
    document.getElementById("cameraStatus");

const message =
    document.getElementById("message");

const expectedCount =
    document.getElementById("expectedCount");

const startTransferBtn =
    document.getElementById("startTransferBtn");

const pendingInfo =
    document.getElementById("pendingInfo");

const pendingData =
    document.getElementById("pendingData");

const captureBtn =
    document.getElementById("captureBtn");

const scanNextBtn =
    document.getElementById("scanNextBtn");

const progressText =
    document.getElementById("progressText");

const progressFill =
    document.getElementById("progressFill");

const chunkGrid =
    document.getElementById("chunkGrid");

const assembledOutput =
    document.getElementById("assembledOutput");

const downloadBtn =
    document.getElementById("downloadBtn");

const resetBtn =
    document.getElementById("resetBtn");

const debugOutput =
    document.getElementById("debugOutput");

const resolutionInfo =
    document.getElementById("resolutionInfo");

const decoderInfo =
    document.getElementById("decoderInfo");

const frameInfo =
    document.getElementById("frameInfo");

const detectionInfo =
    document.getElementById("detectionInfo");

const zoomRow =
    document.getElementById("zoomRow");

const zoomSlider =
    document.getElementById("zoomSlider");

const zoomValue =
    document.getElementById("zoomValue");


/* =========================================================
   UI HELPERS
========================================================= */

function setMessage(text, type = "") {

    message.textContent = text;
    message.className = `message ${type}`;

}


function setDebug(text) {

    const now =
        new Date().toLocaleTimeString();

    debugOutput.value =
        `[${now}] ${text}`;

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        cameraStatus.textContent =
            "Camera: requesting...";

        setMessage(
            "Requesting 1080p camera..."
        );


        if (!("BarcodeDetector" in window)) {

            throw new Error(
                "This browser does not expose BarcodeDetector."
            );

        }


        detector =
            new BarcodeDetector({
                formats: ["qr_code"]
            });


        decoderInfo.textContent =
            "Native BarcodeDetector";


        const constraints = {

            audio: false,

            video: {

                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 60,
                    max: 60
                }

            }

        };


        stream =
            await navigator.mediaDevices.getUserMedia(
                constraints
            );


        videoTrack =
            stream.getVideoTracks()[0];


        video.srcObject =
            stream;


        await video.play();


        const settings =
            videoTrack.getSettings();


        resolutionInfo.textContent =
            `${settings.width || video.videoWidth} × ${
                settings.height || video.videoHeight
            }`;


        setDebug(
            `Camera active: ${
                settings.width || video.videoWidth
            } × ${
                settings.height || video.videoHeight
            }.`
        );


        setupZoom();


        cameraDot.classList.add(
            "active"
        );


        cameraStatus.textContent =
            "Camera: ACTIVE";


        setMessage(
            "Camera active. Scanning for QR...",
            "success"
        );


        scanning =
            true;


        animationId =
            requestAnimationFrame(
                scanLoop
            );


    } catch (error) {

        console.error(error);

        cameraStatus.textContent =
            "Camera: FAILED";


        setMessage(
            error.message || String(error),
            "error"
        );


        setDebug(
            `CAMERA ERROR: ${
                error.message || String(error)
            }`
        );

    }

}


/* =========================================================
   ZOOM
========================================================= */

function setupZoom() {

    if (!videoTrack) {
        return;
    }


    const capabilities =
        videoTrack.getCapabilities
            ? videoTrack.getCapabilities()
            : {};


    if (!capabilities.zoom) {

        setDebug(
            "Camera zoom not exposed by browser."
        );

        return;

    }


    zoomRow.style.display =
        "flex";


    zoomSlider.min =
        capabilities.zoom.min;

    zoomSlider.max =
        capabilities.zoom.max;

    zoomSlider.step =
        capabilities.zoom.step || 0.1;


    const settings =
        videoTrack.getSettings();


    zoomSlider.value =
        settings.zoom ||
        capabilities.zoom.min;


    zoomValue.textContent =
        `${zoomSlider.value}x`;


    zoomSlider.addEventListener(
        "input",
        async () => {

            const zoom =
                Number(zoomSlider.value);

            try {

                await videoTrack.applyConstraints({

                    advanced: [
                        { zoom }
                    ]

                });


                zoomValue.textContent =
                    `${zoom}x`;

            } catch (error) {

                setDebug(
                    `Zoom error: ${
                        error.message
                    }`
                );

            }

        }
    );

}


/* =========================================================
   SCANNER
========================================================= */

async function scanLoop(timestamp) {

    if (!scanning) {
        return;
    }


    /*
     * A QR has already been successfully decoded.
     * Do no more expensive detection until
     * Scan Next QR is pressed.
     */

    if (qrDetected) {

        animationId =
            requestAnimationFrame(
                scanLoop
            );

        return;

    }


    if (
        timestamp - lastScanTime <
        SCAN_INTERVAL
    ) {

        animationId =
            requestAnimationFrame(
                scanLoop
            );

        return;

    }


    lastScanTime =
        timestamp;


    try {

        if (
            video.readyState >=
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {

            framesProcessed++;


            if (
                framesProcessed % 10 === 0
            ) {

                frameInfo.textContent =
                    framesProcessed;

            }


            const results =
                await detector.detect(video);


            if (
                results.length > 0
            ) {

                handleDetectedQr(
                    results[0].rawValue
                );

            } else {

                detectionInfo.textContent =
                    "Scanning";

            }

        }

    } catch (error) {

        console.warn(
            "Scan error:",
            error
        );

    }


    animationId =
        requestAnimationFrame(
            scanLoop
        );

}


/* =========================================================
   QR DETECTED
========================================================= */

function handleDetectedQr(decodedText) {

    /*
     * Ignore the last captured QR if Scan Next
     * was accidentally pressed before changing the QR.
     */

    if (
        decodedText === lockedText
    ) {

        detectionInfo.textContent =
            "Same QR - change to next";

        return;

    }


    if (
        decodedText === pendingText
    ) {

        return;

    }


    pendingText =
        decodedText;


    pendingData.value =
        decodedText;


    detectionInfo.textContent =
        "QR DETECTED";


    /*
     * Immediately pause expensive QR decoding.
     */

    qrDetected =
        true;


    if (totalChunks === null) {

        pendingInfo.textContent =
            "QR detected. Enter expected count and start transfer.";

        captureBtn.disabled =
            true;

        return;

    }


    if (
        capturedCount >= totalChunks
    ) {

        captureBtn.disabled =
            true;

        return;

    }


    pendingInfo.textContent =
        `QR detected: ${
            decodedText.length
        } characters. Ready for capture #${
            capturedCount + 1
        }.`;


    captureBtn.disabled =
        false;


    scanNextBtn.disabled =
        true;


    setMessage(
        `QR detected. Scanner paused.`,
        "success"
    );


    setDebug(
        `QR decoded successfully. ${
            decodedText.length
        } characters.`
    );

}


/* =========================================================
   START TRANSFER
========================================================= */

function startTransfer() {

    const count =
        Number.parseInt(
            expectedCount.value,
            10
        );


    if (
        !Number.isInteger(count) ||
        count < 1
    ) {

        setMessage(
            "Enter a valid expected QR count.",
            "error"
        );

        return;

    }


    totalChunks =
        count;


    expectedCount.disabled =
        true;

    startTransferBtn.disabled =
        true;


    renderGrid();

    updateProgress();


    setMessage(
        `Ready for ${totalChunks} QR codes.`,
        "success"
    );


    if (
        pendingText &&
        pendingText !== lockedText
    ) {

        captureBtn.disabled =
            false;

    }

}


/* =========================================================
   CAPTURE QR
========================================================= */

function capturePendingChunk() {

    if (
        !pendingText ||
        totalChunks === null
    ) {

        return;

    }


    if (
        capturedCount >= totalChunks
    ) {

        return;

    }


    /*
     * Preserve QR text exactly.
     *
     * No trimming.
     * No spaces added.
     * No newlines added.
     */

    chunks.push(
        pendingText
    );


    capturedCount++;


    lockedText =
        pendingText;


    pendingText =
        null;


    pendingData.value =
        "";


    captureBtn.disabled =
        true;


    renderGrid();

    updateProgress();

    rebuildOutput();


    if (navigator.vibrate) {

        navigator.vibrate(60);

    }


    if (
        capturedCount === totalChunks
    ) {

        scanning =
            false;


        qrDetected =
            true;


        detectionInfo.textContent =
            "COMPLETE";


        scanNextBtn.disabled =
            true;


        setMessage(
            "All QR codes captured. Scanner stopped.",
            "success"
        );


        setDebug(
            "Transfer complete."
        );

        return;

    }


    /*
     * Keep scanner paused.
     * User changes the QR manually.
     */

    qrDetected =
        true;


    scanNextBtn.disabled =
        false;


    detectionInfo.textContent =
        "PAUSED";


    setMessage(
        `Captured ${capturedCount}/${totalChunks}. Change QR, then tap Scan Next QR.`,
        "success"
    );


    setDebug(
        `Chunk ${capturedCount} captured. Waiting for user to start next scan.`
    );

}


/* =========================================================
   SCAN NEXT QR
========================================================= */

function scanNextQr() {

    if (
        totalChunks === null
    ) {

        return;

    }


    if (
        capturedCount >= totalChunks
    ) {

        return;

    }


    pendingText =
        null;


    pendingData.value =
        "";


    qrDetected =
        false;


    captureBtn.disabled =
        true;


    scanNextBtn.disabled =
        true;


    detectionInfo.textContent =
        "Scanning";


    setMessage(
        `Scanning for QR #${
            capturedCount + 1
        }...`
    );


    setDebug(
        `Scanning resumed for chunk ${
            capturedCount + 1
        }.`
    );

}


/* =========================================================
   PROGRESS GRID
========================================================= */

function renderGrid() {

    chunkGrid.innerHTML =
        "";


    if (totalChunks === null) {
        return;
    }


    const fragment =
        document.createDocumentFragment();


    for (
        let i = 1;
        i <= totalChunks;
        i++
    ) {

        const cell =
            document.createElement("div");


        cell.className =
            "chunk";


        if (
            i <= capturedCount
        ) {

            cell.classList.add(
                "captured"
            );

        }


        cell.textContent =
            i;


        fragment.appendChild(
            cell
        );

    }


    chunkGrid.appendChild(
        fragment
    );

}


function updateProgress() {

    if (totalChunks === null) {

        progressText.textContent =
            "Captured: 0 / ?";

        progressFill.style.width =
            "0%";

        return;

    }


    const percentage =
        (
            capturedCount /
            totalChunks
        ) * 100;


    progressText.textContent =
        `Captured: ${
            capturedCount
        } / ${
            totalChunks
        }`;


    progressFill.style.width =
        `${percentage}%`;


    downloadBtn.disabled =
        capturedCount !==
        totalChunks;

}


/* =========================================================
   ASSEMBLE TEXT
========================================================= */

function rebuildOutput() {

    assembledOutput.value =
        chunks.join("");

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadText() {

    if (
        capturedCount !==
        totalChunks
    ) {

        return;

    }


    const output =
        chunks.join("");


    const blob =
        new Blob(
            [output],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "extracted_data.txt";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    setMessage(
        "Download started.",
        "success"
    );

}


/* =========================================================
   RESET
========================================================= */

function resetTransfer() {

    if (
        !confirm(
            "Clear all captured data?"
        )
    ) {

        return;

    }


    chunks.length =
        0;


    totalChunks =
        null;

    capturedCount =
        0;

    pendingText =
        null;

    lockedText =
        null;

    qrDetected =
        false;


    expectedCount.value =
        "";

    expectedCount.disabled =
        false;

    startTransferBtn.disabled =
        false;


    pendingData.value =
        "";

    assembledOutput.value =
        "";


    captureBtn.disabled =
        true;

    scanNextBtn.disabled =
        true;

    downloadBtn.disabled =
        true;


    progressText.textContent =
        "Captured: 0 / ?";


    progressFill.style.width =
        "0%";


    chunkGrid.innerHTML =
        "";


    pendingInfo.textContent =
        "Waiting for QR...";


    detectionInfo.textContent =
        "Scanning";


    /*
     * Restart scanner if it had stopped after completion.
     */

    if (!scanning) {

        scanning =
            true;

        animationId =
            requestAnimationFrame(
                scanLoop
            );

    }


    setMessage(
        "Transfer reset. Scanner active."
    );

}


/* =========================================================
   EVENTS
========================================================= */

startTransferBtn.addEventListener(
    "click",
    startTransfer
);


captureBtn.addEventListener(
    "click",
    capturePendingChunk
);


scanNextBtn.addEventListener(
    "click",
    scanNextQr
);


downloadBtn.addEventListener(
    "click",
    downloadText
);


resetBtn.addEventListener(
    "click",
    resetTransfer
);


/* =========================================================
   START
========================================================= */

startCamera();

</script>

</body>
</html>
