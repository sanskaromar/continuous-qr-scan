        background: var(--danger);

    <section class="card">
        <div id="reader"></div>

        <div id="message" class="message">
            Initializing camera...
        </div>
    </section>

    <section class="card">
        <div class="status-row">
            <span class="status-label">Capture Progress</span>
            <span id="progressText" class="status-value">
                Captured: 0 / ?
            </span>
        </div>

        <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="details">
            <div class="detail">
                <span class="detail-label">Unique Chunks</span>
                <span id="uniqueCount" class="detail-value">0</span>
            </div>

            <div class="detail">
                <span class="detail-label">Total Required</span>
                <span id="totalCount" class="detail-value">Unknown</span>
            </div>

            <div class="detail">
                <span class="detail-label">Last Chunk</span>
                <span id="lastChunk" class="detail-value">—</span>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="legend">
            <span class="legend-item">
                <span class="legend-box captured"></span>
                Captured
            </span>

            <span class="legend-item">
                <span class="legend-box"></span>
                Missing
            </span>
        </div>

        <div id="chunkGrid" class="chunk-grid"></div>
    </section>

    <section class="card">
        <div class="actions">
            <button
                id="downloadBtn"
                class="download-btn"
                type="button"
                disabled
            >
                Download Assembled File
            </button>

            <button
                id="resetBtn"
                class="reset-btn"
                type="button"
            >
                Clear / Reset
            </button>
        </div>

<script>
    /*
     * QR payload format:
     *
     * CurrentChunk/TotalChunks|Data
     *
     * Example:
     * 3/140|aB3x9Z...
     *
     * Chunks are stored by their numeric index, so scanning order
     * does not matter.
     */

    const chunks = new Map();

    let totalChunks = null;
    let scanner = null;
    let isResetting = false;

    const reader = document.getElementById("reader");
    const message = document.getElementById("message");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const uniqueCount = document.getElementById("uniqueCount");
    const totalCount = document.getElementById("totalCount");
    const lastChunk = document.getElementById("lastChunk");
    const chunkGrid = document.getElementById("chunkGrid");
    const downloadBtn = document.getElementById("downloadBtn");
    const resetBtn = document.getElementById("resetBtn");

    function setMessage(text, type = "") {
        message.textContent = text;
        message.className = `message ${type}`.trim();
    }

    function parseQrPayload(decodedText) {
        const separatorIndex = decodedText.indexOf("|");

        if (separatorIndex === -1) {
            return null;
        }

        const metadata = decodedText.slice(0, separatorIndex);
        const data = decodedText.slice(separatorIndex + 1);

        const match = metadata.match(/^(\d+)\/(\d+)$/);

        if (!match) {
            return null;
        }

        const index = Number.parseInt(match[1], 10);
        const total = Number.parseInt(match[2], 10);

        if (
            !Number.isInteger(index) ||
            !Number.isInteger(total) ||
            index < 1 ||
            total < 1 ||
            index > total
        ) {
            return null;
        }

        return {
            index,
            total,
            data
        };
    }

    function renderChunkGrid() {
        chunkGrid.innerHTML = "";

        if (!totalChunks) {
            return;
        }

        const fragment = document.createDocumentFragment();

        for (let index = 1; index <= totalChunks; index++) {
            const cell = document.createElement("div");

            cell.className = "chunk";

            if (chunks.has(index)) {
                cell.classList.add("captured");
            }

            cell.textContent = index;
            cell.title = chunks.has(index)
                ? `Chunk ${index}: captured`
                : `Chunk ${index}: missing`;

            fragment.appendChild(cell);
        }

        chunkGrid.appendChild(fragment);
    }

    function updateProgress() {
        const captured = chunks.size;

        uniqueCount.textContent = captured;
        totalCount.textContent = totalChunks ?? "Unknown";

        if (!totalChunks) {
            progressText.textContent = "Captured: 0 / ?";
            progressFill.style.width = "0%";
            progressFill.classList.remove("complete");
            downloadBtn.disabled = true;
            return;
        }

        const percentage = Math.min(
            100,
            (captured / totalChunks) * 100
        );

        progressText.textContent =
            `Captured: ${captured} / ${totalChunks}`;

        progressFill.style.width = `${percentage}%`;

        const complete =
            captured === totalChunks &&
            allChunksPresent();

        progressFill.classList.toggle("complete", complete);
        downloadBtn.disabled = !complete;
    }

    function allChunksPresent() {
        if (!totalChunks || chunks.size !== totalChunks) {
            return false;
        }

        for (let index = 1; index <= totalChunks; index++) {
            if (!chunks.has(index)) {
                return false;
            }
        }

        return true;
    }

    function processScan(decodedText) {
        if (isResetting) {
            return;
        }

        const payload = parseQrPayload(decodedText);

        if (!payload) {
            setMessage(
                "Ignored invalid QR payload. Expected: Current/Total|Data",
                "error"
            );
            return;
        }

        const {
            index,
            total,
            data
        } = payload;

        /*
         * The first valid chunk establishes the expected sequence length.
         */
        if (totalChunks === null) {
            totalChunks = total;
            renderChunkGrid();
        }

        /*
         * Reject chunks belonging to a different transfer.
         */
        if (total !== totalChunks) {
            setMessage(
                `Ignored chunk ${index}: expected total ${totalChunks}, received ${total}.`,
                "error"
            );
            return;
        }

        /*
         * Prevent duplicate chunks. The same QR frame may be detected
         * repeatedly while it remains visible to the camera.
         */
        if (chunks.has(index)) {
            lastChunk.textContent = `${index} (duplicate)`;
            return;
        }

        chunks.set(index, data);

        lastChunk.textContent = index;

        const gridCell =
            chunkGrid.children[index - 1];

        if (gridCell) {
            gridCell.classList.add("captured");
            gridCell.title = `Chunk ${index}: captured`;
        }

        updateProgress();

        if (navigator.vibrate) {
            navigator.vibrate(40);
        }

        if (allChunksPresent()) {
            setMessage(
                "All chunks captured. File is ready for download.",
                "success"
            );
        } else {
            setMessage(
                `Captured chunk ${index}. Waiting for missing chunks...`
            );
        }
    }

    async function startScanner() {
        if (typeof Html5Qrcode === "undefined") {
            setMessage(
                "QR scanner library failed to load.",
                "error"
            );
            return;
        }

        scanner = new Html5Qrcode("reader");

        const config = {
            fps: 20,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
                const size = Math.floor(
                    Math.min(viewfinderWidth, viewfinderHeight) * 0.82
                );

                return {
                    width: size,
                    height: size
                };
            },
            disableFlip: false
        };

        try {
            await scanner.start(
                { facingMode: { ideal: "environment" } },
                config,
                processScan,
                () => {
                    /*
                     * Scan failures occur continuously while no QR code
                     * is visible. They are intentionally ignored so the
                     * scanner keeps running at full speed.
                     */
                }
            );

            setMessage(
                "Camera active. Point it at the QR code sequence."
            );
        } catch (error) {
            console.error("Camera start failed:", error);

            /*
             * Desktop/browser fallback:
             * ask for available cameras and use the first one.
             */
            try {
                const cameras =
                    await Html5Qrcode.getCameras();

                if (!cameras || cameras.length === 0) {
                    throw new Error("No camera found.");
                }

                await scanner.start(
                    cameras[0].id,
                    config,
                    processScan,
                    () => {}
                );

                setMessage(
                    "Camera active. Point it at the QR code sequence."
                );
            } catch (fallbackError) {
                console.error(
                    "Camera fallback failed:",
                    fallbackError
                );

                setMessage(
                    "Unable to access a camera. Check browser permissions and ensure the page is served from HTTPS or localhost.",
                    "error"
                );
            }
        }
    }

    function assembleBase64() {
        if (!allChunksPresent()) {
            throw new Error("Transfer is incomplete.");
        }

        const orderedChunks = [];

        for (let index = 1; index <= totalChunks; index++) {
            orderedChunks.push(chunks.get(index));
        }

        /*
         * join("") deliberately inserts nothing between chunks:
         * no spaces, commas, or newlines.
         */
        return orderedChunks.join("");
    }

    function base64ToBlob(base64) {
        /*
         * Remove only whitespace in case the sender encoded standard
         * Base64 with line wrapping. Normally the stream contains none.
         */
        const cleanBase64 = base64.replace(/\s/g, "");

        const binaryString = atob(cleanBase64);
        const bytes = new Uint8Array(binaryString.length);

        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }

        return new Blob(
            [bytes],
            {
                type: "application/gzip"
            }
        );
    }

    function downloadAssembledFile() {
        try {
            const combinedBase64 = assembleBase64();
            const blob = base64ToBlob(combinedBase64);

            const url = URL.createObjectURL(blob);

            const anchor = document.createElement("a");

            anchor.href = url;
            anchor.download = "extracted_data.tar.gz";

            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();

            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 1000);

            setMessage(
                "Download started: extracted_data.tar.gz",
                "success"
            );
        } catch (error) {
            console.error("Assembly/download failed:", error);

            setMessage(
                `Download failed: ${error.message}`,
                "error"
            );
        }
    }

    function resetTransfer() {
        if (!window.confirm(
            "Clear all captured chunks and start over?"
        )) {
            return;
        }

        isResetting = true;

        chunks.clear();
        totalChunks = null;

        uniqueCount.textContent = "0";
        totalCount.textContent = "Unknown";
        lastChunk.textContent = "—";

        progressText.textContent = "Captured: 0 / ?";
        progressFill.style.width = "0%";
        progressFill.classList.remove("complete");

        chunkGrid.innerHTML = "";

        downloadBtn.disabled = true;

        setMessage(
            "Transfer cleared. Scanner is still running."
        );

        isResetting = false;
    }

    downloadBtn.addEventListener(
        "click",
        downloadAssembledFile
    );

    resetBtn.addEventListener(
        "click",
        resetTransfer
    );

    startScanner();
</script>
