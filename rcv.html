<title>QR Text Receiver</title>

<!-- QR scanner library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
    :root {
        color-scheme: dark light;

        --bg: #0b1020;
        --card: #151c2e;
        --card2: #1d263b;
        --border: #2d3a58;
        --text: #edf2ff;
        --muted: #a2aec4;
        --primary: #4f8cff;
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #f59e0b;
        --missing: #26324a;
    }

    @media (prefers-color-scheme: light) {
        :root {
            --bg: #eef2f7;
            --card: #ffffff;
            --card2: #f5f7fa;
            --border: #d7deea;
            --text: #182033;
            --muted: #64748b;
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --missing: #e5eaf1;
        }
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    .app {
        width: min(100%, 850px);
        margin: auto;
        padding: 16px;
    }

    h1 {
        margin: 0 0 6px;
        font-size: 1.8rem;
    }

    .subtitle {
        color: var(--muted);
        margin: 0 0 20px;
    }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
    }

    .camera-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 0.9rem;
        font-weight: 700;
    }

    .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--danger);
    }

    .dot.active {
        background: var(--success);
    }

    #reader {
        width: 100%;
        overflow: hidden;
        border-radius: 12px;
        background: #000;
    }

    #reader video {
        border-radius: 12px;
    }

    .status-message {
        min-height: 24px;
        margin-top: 12px;
        color: var(--muted);
    }

    .status-message.success {
        color: var(--success);
    }

    .status-message.error {
        color: var(--danger);
    }

    .status-message.warning {
        color: var(--warning);
    }

    .preview-box {
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        min-height: 120px;
    }

    .preview-label {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 8px;
    }

    #pendingInfo {
        font-weight: 700;
        margin-bottom: 8px;
    }

    #pendingData {
        width: 100%;
        min-height: 90px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        background: var(--bg);
        color: var(--text);
        font: 0.85rem/1.4 monospace;
    }

    .progress-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-weight: 700;
    }

    .progress-track {
        height: 14px;
        border-radius: 999px;
        background: var(--missing);
        overflow: hidden;
        border: 1px solid var(--border);
    }

    #progressFill {
        width: 0%;
        height: 100%;
        background: var(--primary);
        transition: width 0.2s ease;
    }

    #progressFill.complete {
        background: var(--success);
    }

    .chunk-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
        gap: 6px;
        margin-top: 16px;
        max-height: 280px;
        overflow-y: auto;
    }

    .chunk {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        background: var(--missing);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
    }

    .chunk.captured {
        background: var(--success);
        border-color: var(--success);
        color: white;
    }

    .actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 13px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .capture {
        background: var(--success);
        color: white;
    }

    .download {
        background: var(--primary);
        color: white;
    }

    .reset {
        background: var(--danger);
        color: white;
    }

    .assembled {
        width: 100%;
        min-height: 250px;
        resize: vertical;
        background: var(--card2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font: 0.9rem/1.45 monospace;
    }

    @media (max-width: 600px) {
        .actions {
            grid-template-columns: 1fr;
        }
    }
</style>

```
    <h1>QR Text Receiver</h1>

    <p class="subtitle">
        Scan a QR, verify the preview, press Capture, then advance to the
        next QR on the source computer.
    </p>

        <section class="card">
    <label for="expectedCount">
        How many QR codes will you scan?
    </label>

    <div style="display:flex; gap:10px; margin-top:10px;">
        <input
            id="expectedCount"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="Example: 50"
            style="
                flex:1;
                padding:12px;
                border-radius:8px;
                border:1px solid var(--border);
                background:var(--card2);
                color:var(--text);
                font:inherit;
            "
        >

        <button
            id="setCountBtn"
            type="button"
            style="
                background:var(--primary);
                color:white;
            "
        >
            Start Transfer
        </button>
    </div>
</section>

    <section class="card">

        <div class="camera-status">
            <span id="cameraDot" class="dot"></span>
            <span id="cameraStatus">Camera: starting...</span>
        </div>

        <div id="reader"></div>

        <div id="message" class="status-message">
            Requesting camera access...
        </div>

    </section>


    <section class="card">

        <span class="preview-label">CURRENT QR DETECTED</span>

        <div class="preview-box">

            <div id="pendingInfo">
                No QR detected yet.
            </div>

            <textarea
                id="pendingData"
                readonly
                placeholder="Detected QR data will appear here..."
            ></textarea>

        </div>

        <div style="height: 12px;"></div>

        <button
            id="captureBtn"
            class="capture"
            type="button"
            disabled
        >
            Capture This QR
        </button>

    </section>


    <section class="card">

        <div class="progress-row">
            <span>Progress</span>
            <span id="progressText">Captured: 0 / ?</span>
        </div>

        <div class="progress-track">
            <div id="progressFill"></div>
        </div>

        <div id="chunkGrid" class="chunk-grid"></div>

    </section>


    <section class="card">

        <div class="actions">

            <button
                id="downloadBtn"
                class="download"
                type="button"
                disabled
            >
                Download Assembled Text
            </button>

            <button
                id="resetBtn"
                class="reset"
                type="button"
            >
                Clear / Reset
            </button>

        </div>

    </section>


    <section class="card">

        <span class="preview-label">
            ASSEMBLED TEXT PREVIEW
        </span>

        <textarea
            id="assembledOutput"
            class="assembled"
            readonly
            placeholder="Captured text will appear here in chunk order..."
        ></textarea>

    </section>

</main>


<script>

    /*
     * Expected QR format:
     *
     * 1/50|Hello this is the first piece
     * 2/50| of text
     * 3/50| and so on...
     */

    const chunks = new Map();

    let totalChunks = null;
let capturedCount = 0;
let pendingText = null;

const expectedCount =
    document.getElementById("expectedCount");

const setCountBtn =
    document.getElementById("setCountBtn");

    let totalChunks = null;

    let pendingChunk = null;

    let scanner = null;

    const message =
        document.getElementById("message");

    const cameraDot =
        document.getElementById("cameraDot");

    const cameraStatus =
        document.getElementById("cameraStatus");

    const pendingInfo =
        document.getElementById("pendingInfo");

    const pendingData =
        document.getElementById("pendingData");

    const captureBtn =
        document.getElementById("captureBtn");

    const progressText =
        document.getElementById("progressText");

    const progressFill =
        document.getElementById("progressFill");

    const chunkGrid =
        document.getElementById("chunkGrid");

    const assembledOutput =
        document.getElementById("assembledOutput");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const resetBtn =
        document.getElementById("resetBtn");


    function setMessage(text, type = "") {

        message.textContent = text;

        message.className =
            `status-message ${type}`;

    }


    function parsePayload(text) {

        const separator =
            text.indexOf("|");

        if (separator === -1) {
            return null;
        }

        const metadata =
            text.slice(0, separator);

        const data =
            text.slice(separator + 1);

        const match =
            metadata.match(/^(\d+)\/(\d+)$/);

        if (!match) {
            return null;
        }

        const index =
            Number.parseInt(match[1], 10);

        const total =
            Number.parseInt(match[2], 10);

        if (
            !Number.isInteger(index) ||
            !Number.isInteger(total) ||
            index < 1 ||
            total < 1 ||
            index > total
        ) {
            return null;
        }

        return {
            index,
            total,
            data
        };

    }


    function onQrDetected(decodedText) {

    /*
     * Do not allow scanning until the user has
     * specified the expected number of QR codes.
     */

    if (!totalChunks) {
        pendingChunk = null;
        captureBtn.disabled = true;

        pendingInfo.textContent =
            "First enter the expected number of QR codes.";

        pendingData.value = decodedText;

        return;
    }


    /*
     * If there is already a QR waiting to be captured,
     * ignore repeated detections of the same visible QR.
     */

    if (pendingText === decodedText) {
        return;
    }


    /*
     * If the previous QR has not yet been manually captured,
     * keep that QR as the pending one.
     */

    if (pendingText !== null) {
        return;
    }


    pendingText = decodedText;

    pendingInfo.textContent =
        `Ready to capture QR ${capturedCount + 1} of ${totalChunks}`;

    pendingData.value =
        decodedText;

    captureBtn.disabled = false;

    setMessage(
        "QR detected. Press Capture This QR, then advance the QR on the Mac.",
        "success"
    );

}


    function renderGrid() {

        chunkGrid.innerHTML = "";

        if (!totalChunks) {
            return;
        }

        const fragment =
            document.createDocumentFragment();

        for (
            let index = 1;
            index <= totalChunks;
            index++
        ) {

            const cell =
                document.createElement("div");

            cell.className = "chunk";

            cell.textContent = index;

            if (chunks.has(index)) {
                cell.classList.add("captured");
            }

            fragment.appendChild(cell);

        }

        chunkGrid.appendChild(fragment);

    }


function allChunksPresent() {

    return (
        totalChunks !== null &&
        capturedCount === totalChunks
    );

}


    function updateProgress() {

    if (!totalChunks) {

        progressText.textContent =
            "Captured: 0 / ?";

        progressFill.style.width =
            "0%";

        downloadBtn.disabled = true;

        return;
    }


    const percentage =
        (capturedCount / totalChunks) * 100;


    progressText.textContent =
        `Captured: ${capturedCount} / ${totalChunks}`;


    progressFill.style.width =
        `${percentage}%`;


    const complete =
        capturedCount === totalChunks;


    progressFill.classList.toggle(
        "complete",
        complete
    );


    downloadBtn.disabled =
        !complete;

}


    function rebuildOutput() {

    let output = "";

    for (
        let index = 1;
        index <= capturedCount;
        index++
    ) {

        output += chunks.get(index);

    }

    assembledOutput.value = output;

}


    function capturePendingChunk() {

    if (pendingText === null) {
        return;
    }

    if (!totalChunks) {
        setMessage(
            "Set the expected number of QR codes first.",
            "error"
        );

        return;
    }

    if (capturedCount >= totalChunks) {
        return;
    }


    /*
     * Store strictly in capture order.
     *
     * First captured QR becomes chunk 1,
     * second becomes chunk 2, etc.
     */

    capturedCount++;

    chunks.set(
        capturedCount,
        pendingText
    );


    pendingInfo.textContent =
        `QR ${capturedCount} captured successfully.`;

    pendingData.value =
        pendingText;

    pendingText = null;

    captureBtn.disabled = true;


    renderGrid();

    updateProgress();

    rebuildOutput();


    if (navigator.vibrate) {
        navigator.vibrate(50);
    }


    if (capturedCount === totalChunks) {

        setMessage(
            "All QR codes captured. Text is complete.",
            "success"
        );

    } else {

        setMessage(
            `QR ${capturedCount} captured. Advance to QR ${capturedCount + 1}.`,
            "success"
        );

    }

}


    function downloadText() {

        if (!allChunksPresent()) {
            return;
        }


        const finalText =
            assembledOutput.value;


        const blob =
            new Blob(
                [finalText],
                {
                    type: "text/plain;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "extracted_data.txt";


        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(
            () => URL.revokeObjectURL(url),
            1000
        );

    }


    function resetTransfer() {

        if (
            !window.confirm(
                "Clear all captured chunks?"
            )
        ) {
            return;
        }


        chunks.clear();

        totalChunks = null;

        pendingChunk = null;


        pendingInfo.textContent =
            "No QR detected yet.";

        pendingData.value = "";

        assembledOutput.value = "";


        captureBtn.disabled = true;

        downloadBtn.disabled = true;


        progressText.textContent =
            "Captured: 0 / ?";

        progressFill.style.width =
            "0%";

        progressFill.classList.remove(
            "complete"
        );


        chunkGrid.innerHTML = "";


        setMessage(
            "Transfer cleared. Camera remains active."
        );

    }


    async function startCamera() {
    if (typeof Html5Qrcode === "undefined") {
        cameraStatus.textContent =
            "Camera: scanner library failed to load";

        setMessage(
            "QR scanner library could not be loaded.",
            "error"
        );

        return;
    }

    const config = {
        fps: 10,

        qrbox: (width, height) => {
            const size = Math.floor(
                Math.min(width, height) * 0.8
            );

            return {
                width: size,
                height: size
            };
        }
    };

    cameraDot.classList.remove("active");

    cameraStatus.textContent =
        "Camera: looking for cameras...";

    setMessage(
        "Requesting camera access..."
    );

    try {
        /*
         * Ask the browser for permission and enumerate cameras.
         *
         * On many phones, camera labels may initially be empty until
         * permission has been granted.
         */
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
            throw new Error("No cameras found.");
        }

        /*
         * Try to select a rear/back camera.
         * Fall back to the first available camera.
         */
        const preferredCamera =
            cameras.find(camera =>
                /back|rear|environment/i.test(camera.label || "")
            ) || cameras[cameras.length - 1];

        /*
         * Create ONE fresh scanner instance.
         */
        scanner = new Html5Qrcode("reader");

        await scanner.start(
            preferredCamera.id,
            config,
            onQrDetected,
            () => {
                /*
                 * No QR found in this frame.
                 * This is normal, so do nothing.
                 */
            }
        );

        cameraDot.classList.add("active");

        cameraStatus.textContent =
            "Camera: ACTIVE";

        setMessage(
            `Camera active: ${preferredCamera.label || "camera"}`,
            "success"
        );

    } catch (error) {
        console.error("Camera startup failed:", error);

        cameraDot.classList.remove("active");

        cameraStatus.textContent =
            "Camera: FAILED";

        setMessage(
            `Camera access failed: ${error.message}`,
            "error"
        );
    }
}


    captureBtn.addEventListener(
        "click",
        capturePendingChunk
    );


    downloadBtn.addEventListener(
        "click",
        downloadText
    );


    resetBtn.addEventListener(
        "click",
        resetTransfer
    );
    setCountBtn.addEventListener(
    "click",
    () => {

        const count =
            Number.parseInt(
                expectedCount.value,
                10
            );


        if (
            !Number.isInteger(count) ||
            count < 1
        ) {

            setMessage(
                "Enter a valid number of QR codes.",
                "error"
            );

            return;

        }


        if (
            capturedCount > 0
        ) {

            setMessage(
                "Clear the current transfer before starting a new one.",
                "warning"
            );

            return;

        }


        totalChunks = count;

        expectedCount.disabled = true;

        setCountBtn.disabled = true;


        renderGrid();

        updateProgress();


        setMessage(
            `Ready to capture ${totalChunks} QR codes.`,
            "success"
        );

    }
);


    startCamera();

</script>
